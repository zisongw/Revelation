<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Seven Churches of Revelation · An Atlas</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --parchment-card: #faf6ec;
      --ink: #2b2520;
      --border-atlas: #8b7b65;
      --gold: #A8801A;
      --fire: #B03A2E;
      --deceive: #2E3D5C;
      --rome: #6B2D5C;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%;
      height: 100vh; height: 100dvh; overflow: hidden; overscroll-behavior: none;
      background-color: #e9e0cc; color: var(--ink);
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-serif-atlas { font-family: 'EB Garamond', 'Noto Serif SC', Georgia, serif; }
    .font-kai { font-family: 'Kaiti SC', 'STKaiti', 'KaiTi', '楷体', 'BiauKai', 'Noto Serif SC', serif; }
    .font-greek { font-family: 'SBL Greek', 'Gentium Plus', 'EB Garamond', 'Noto Serif', serif; font-style: italic; }
    .parchment-panel {
      background-color: var(--parchment-card);
      background-image: linear-gradient(180deg, rgba(255,253,248,0.82) 0%, rgba(235,224,200,0.38) 100%);
    }
    .atlas-legend-glass {
      background: linear-gradient(180deg, rgba(250,246,236,0.66) 0%, rgba(243,235,216,0.54) 100%);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      border: 1px solid rgba(93,80,64,0.48);
      box-shadow: inset 0 0 0 1px rgba(255,252,245,0.35), 0 4px 14px rgba(43,37,32,0.10);
    }
    .legend-text-halo { text-shadow: 0 0 5px rgba(250,246,236,0.92), 0 0 2px rgba(250,246,236,0.85); }
    #map-container { width: 100%; height: 100%; background-color: #bed7e5; position: relative; z-index: 0; }
    .map-neatline-overlay {
      pointer-events: none; position: absolute; inset: 8px;
      border: 1.5px solid rgba(93,80,64,0.72);
      box-shadow: inset 0 0 0 3px rgba(250,246,236,0.45), inset 0 0 0 4px rgba(139,123,101,0.45);
      z-index: 5;
    }

    /* Map labels */
    .geo-label-water { pointer-events: none; text-align: center; font-family: 'EB Garamond', 'Noto Serif SC', Georgia, serif;
      font-style: italic; color: #214e66; line-height: 1.15; white-space: nowrap; user-select: none;
      text-shadow: 0 0 4px rgba(206,226,237,0.95), 0 0 8px rgba(206,226,237,0.85); }
    .geo-label-region { pointer-events: none; text-align: center; font-family: 'EB Garamond', 'Noto Serif SC', Georgia, serif;
      letter-spacing: 0.14em; line-height: 1.2; white-space: nowrap; user-select: none; font-weight: 600; color: rgba(88,72,52,0.62);
      text-shadow: 0 0 4px rgba(245,238,220,0.95), 0 0 2px rgba(245,238,220,0.95); }
    .geo-label-river { pointer-events: none; white-space: nowrap; font: italic 600 10px 'EB Garamond', 'Noto Serif SC', serif; color: #2f6178;
      text-shadow: 0 0 3px rgba(245,238,220,0.95), 0 0 2px rgba(245,238,220,0.95); }
    .prov-label { pointer-events: none; white-space: nowrap; text-align: center; font: 700 13px/1.2 'EB Garamond', 'Noto Serif SC', serif;
      letter-spacing: 0.2em; color: var(--rome); opacity: .78; text-shadow: 0 0 4px rgba(250,246,236,0.98), 0 0 8px rgba(250,246,236,0.7); }
    .place-wrap { position: relative; pointer-events: none; }
    .place-dot { width: 6px; height: 6px; border-radius: 50%; background: #2b2520; border: 1.2px solid #faf6ec; box-shadow: 0 0 0 0.6px rgba(43,37,32,0.6); }
    .place-lbl { position: absolute; left: 9px; top: 50%; transform: translateY(-52%); white-space: nowrap;
      font-family: 'EB Garamond', 'Noto Serif SC', Georgia, serif; font-size: 11.5px; font-weight: 600; color: #3a3128;
      text-shadow: 0 0 3px #faf6ec, 0 0 2px #faf6ec, 0 0 6px rgba(250,246,236,0.9); }
    .place-lbl.t1 { font-size: 12.5px; font-weight: 700; color: #231d17; }
    .zl-b .pt-2, .zl-c .pt-3 { display: none; }
    .zl-b .geo-label-river, .zl-a .prov-label { display: none; }
    .hide-places .place-wrap { display: none; }

    /* Church markers — lampstands */
    .ch-pin { position: relative; cursor: pointer; }
    .ch-dot { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #e7c55a 0%, #b8892b 62%, #8a6416 100%); color: #2b2008;
      font: 700 11px/1 'EB Garamond', 'Inter', serif; border: 2px solid #faf6ec; box-shadow: 0 0 0 1px #5c4512, 0 2px 6px rgba(30,24,18,0.35);
      transition: transform .15s ease; }
    .ch-pin.prologue .ch-dot { background: #faf6ec; color: #6a4b10; box-shadow: 0 0 0 1px #8a6416, 0 2px 6px rgba(30,24,18,0.3); }
    .ch-pin:hover .ch-dot { transform: scale(1.12); }
    .ch-pin.is-active .ch-dot { transform: scale(1.22); box-shadow: 0 0 0 2.5px #2b2520, 0 3px 10px rgba(0,0,0,0.35); }
    .ch-name { position: absolute; left: 29px; top: 50%; transform: translateY(-52%); white-space: nowrap;
      font: 700 13px/1.15 'Noto Serif SC', 'EB Garamond', serif; color: #2b2520;
      text-shadow: 0 0 4px #faf6ec, 0 0 2px #faf6ec, 0 0 7px rgba(250,246,236,0.95); }
    body.lang-en .ch-name { font-family: 'EB Garamond', Georgia, serif; font-size: 14.5px; }
    .zl-a .ch-name { display: none; }
    .ch-name small { display: block; font: 500 10px/1.2 'Inter', 'Noto Sans SC', sans-serif; color: #6a5b49; }
    .ch-pulse { position: absolute; inset: -6px; border-radius: 50%; border: 2.5px solid #c9a227; opacity: 0; pointer-events: none; }
    .ch-pin.is-active .ch-pulse { animation: pulseRing 1.7s ease-out infinite; }
    @keyframes pulseRing { 0% { transform: scale(0.85); opacity: 0.9; } 100% { transform: scale(2.1); opacity: 0; } }

    /* Archaeological sites */
    .site-pin { position: relative; cursor: pointer; }
    .site-dia { width: 11px; height: 11px; transform: rotate(45deg); background: #2F6F73; border: 1.6px solid #faf6ec; box-shadow: 0 0 0 0.8px #1d4548; }
    .site-pin.is-active .site-dia { background: #c9a227; box-shadow: 0 0 0 2px #2b2520; }
    .site-lbl { position: absolute; left: 13px; top: 50%; transform: translateY(-55%); white-space: nowrap;
      font: 600 11px/1.2 'Noto Serif SC', 'EB Garamond', serif; color: #1d4548;
      text-shadow: 0 0 3px #faf6ec, 0 0 2px #faf6ec, 0 0 6px rgba(250,246,236,0.9); }
    .zl-d .site-pin:not(.is-active) .site-lbl { display: none; }
    .zl-e .site-pin { display: none; }

    .dist-tag { pointer-events: none; white-space: nowrap; width: max-content; transform: translate(-50%, -50%);
      background: rgba(250,246,236,0.94); border: 1px solid #8A6A1A; border-radius: 10px; padding: 1px 7px;
      font: 600 10.5px/1.35 'Inter', 'Noto Sans SC', sans-serif; color: #5c4512; box-shadow: 0 1px 4px rgba(43,37,32,0.15); }

    .site-callout { position: relative; pointer-events: none; }
    .site-callout .box { position: absolute; left: 14px; top: -14px; max-width: 240px; width: max-content; background: rgba(250,246,236,0.97);
      border: 1px solid #8b7b65; border-left: 3px solid #2F6F73; border-radius: 4px; padding: 3px 8px;
      font: 600 11.5px/1.35 'Noto Serif SC','EB Garamond',serif; color: #2b2520; box-shadow: 0 2px 8px rgba(43,37,32,0.18); }

    @media (prefers-reduced-motion: reduce) { .ch-pin.is-active .ch-pulse { animation: none; opacity: .6; } }

    body.lang-zh .only-en { display: none !important; }
    body.lang-en .only-zh { display: none !important; }

    .leaflet-container { background: #bed7e5 !important; font-family: 'Inter', 'Noto Sans SC', sans-serif !important; }
    .leaflet-div-icon { background: transparent !important; border: none !important; }
    .leaflet-control-scale { margin-bottom: 64px !important; margin-left: 16px !important; }
    .leaflet-control-scale-line { background: rgba(250,246,236,0.92) !important; border-color: #2b2520 !important; color: #2b2520 !important;
      font: 600 10px 'Inter', sans-serif !important; padding: 1px 6px !important; border-radius: 3px !important; }

    .atlas-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .atlas-scroll::-webkit-scrollbar-track { background: rgba(139,123,101,0.08); }
    .atlas-scroll::-webkit-scrollbar-thumb { background: rgba(139,123,101,0.35); border-radius: 9999px; }

    /* Scripture citations — 中文和合本 (page tooltip) · English LSB (Logos Reftagger) */
    a.sc-zh { color: #6a3d12; text-decoration: none; border-bottom: 1px dotted rgba(106,61,18,0.55); white-space: nowrap; cursor: pointer; }
    a.sc-zh:hover { color: #9b2226; border-bottom-style: solid; background: rgba(201,162,39,0.12); border-radius: 2px; }
    .sc-en { white-space: normal; }
    .sc-en a, a.rtBibleRef { color: #6a3d12 !important; text-decoration: none !important; border-bottom: 1px dotted rgba(106,61,18,0.55); white-space: nowrap; }
    .sc-en a:hover, a.rtBibleRef:hover { color: #9b2226 !important; border-bottom-style: solid; }
    a:focus-visible, button:focus-visible { outline: 2px solid #c9a227; outline-offset: 2px; border-radius: 3px; }
    #zh-tip { position: fixed; z-index: 3000; display: none; max-height: 46vh; overflow: hidden; flex-direction: column;
      background: #fcf9f2; border: 1px solid #8b7b65; border-radius: 8px; box-shadow: 0 8px 24px rgba(43,37,32,0.22);
      font-family: 'Kaiti SC','STKaiti','KaiTi','楷体','Noto Serif SC',serif; color: #2b2520; }
    #zh-tip.visible { display: flex; }
    #zh-tip .zt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 6px 10px; background: #efe5cf;
      border-bottom: 1px solid #d9cbb2; font: 700 12.5px 'Noto Serif SC', serif; border-radius: 8px 8px 0 0; }
    #zh-tip .zt-ver { font: 500 10.5px 'Noto Sans SC', sans-serif; color: #6a5b49; }
    #zh-tip .zt-body { padding: 8px 10px; font-size: 14px; line-height: 1.7; overflow-y: auto; }
    #zh-tip .zt-v + .zt-v::before { content: ' '; }
    #zh-tip sup { font: 600 9px 'Inter', sans-serif; color: #8b7b65; margin: 0 2px 0 1px; }
    #zh-tip .zt-muted { color: #7a6955; font-size: 12px; }
    #zh-tip .zt-foot { padding: 4px 10px 6px; font: 500 10.5px 'Noto Sans SC', sans-serif; color: #7a6955; border-top: 1px dashed #e0d4bc; }

    .tab-btn.is-active { background: #2b2520; color: #faf6ec; }
    .kv { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 6px; }
    .kv dt { color: #7a6955; font-size: 11px; white-space: nowrap; padding-top: 2px; }
    .kv dd { margin: 0; font-size: 12.5px; line-height: 1.6; }
    body.lang-en .kv dd { font-family: 'EB Garamond', Georgia, serif; font-size: 14px; line-height: 1.4; }
    .kv dd.none { color: #8b7b65; font-style: italic; }
    .note-body p, .note-body li { font-size: 12.5px; line-height: 1.65; }
    body.lang-en .note-body p, body.lang-en .note-body li { font-family: 'EB Garamond', Georgia, serif; font-size: 14.5px; line-height: 1.45; }
    .note-body ul { padding-left: 16px; list-style: disc; margin: 4px 0; }
    .note-body li { margin-bottom: 3px; }
    .note-body p + p, .note-body p + ul, .note-body ul + p { margin-top: 6px; }
    .basis li { position: relative; padding-left: 12px; margin-bottom: 4px; }
    .basis li::before { content: ''; position: absolute; left: 1px; top: 0.62em; width: 5px; height: 5px; border-radius: 50%; background: #8b7b65; }
    .tag-x { font-size: 0.86em; color: #7a6955; }

    @media (max-width: 960px) {
      #workspace { flex-direction: column; }
      #map-pane { height: 52%; width: 100%; }
      #study-sidebar { height: 48%; width: 100% !important; border-left: none !important; border-top: 2px solid var(--border-atlas); }
      #study-sidebar.hidden-sidebar { display: none; }
      #map-pane.expanded-map { height: 100%; }
      #detail-panel { max-height: 52% !important; }
      .leaflet-control-scale { display: none; }
    }
  </style>
</head>
<body class="lang-en flex flex-col h-[100dvh] w-screen overflow-hidden">

  <header class="parchment-panel border-b-2 border-[#8b7b65] px-2.5 sm:px-4 py-1.5 sm:py-2 flex flex-wrap items-center justify-between gap-1.5 sm:gap-2 shrink-0 z-30 shadow-sm">
    <div class="flex items-center gap-2 min-w-0 flex-1">
      <div class="hidden sm:flex w-8 h-8 rounded-full border border-[#8b7b65] bg-[#f3ebd8] items-center justify-center shrink-0" aria-hidden="true">
        <svg class="w-4 h-4 text-[#6a4b10]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 3v15M5 8v4a7 7 0 0 0 14 0V8M8.5 9v3a3.5 3.5 0 0 0 7 0V9M8 21h8" /><circle cx="12" cy="3" r="0.8" fill="currentColor"/><circle cx="5" cy="7.2" r="0.8" fill="currentColor"/><circle cx="19" cy="7.2" r="0.8" fill="currentColor"/>
        </svg>
      </div>
      <div class="truncate min-w-0">
        <div class="flex items-baseline gap-2">
          <h1 class="font-serif-atlas font-bold text-sm sm:text-lg text-[#2b2520] truncate">
            <span class="only-zh">启示录七教会：地图与书信</span>
            <span class="only-en">The Seven Churches of Revelation: An Atlas</span>
          </h1>
          <span class="hidden md:inline-block text-[10.5px] font-medium px-2 py-0.5 rounded-full bg-[#e9dec6] text-[#5c4a35] border border-[#c7b698]">
            <span class="only-zh">启示录 1–3 章</span><span class="only-en">Revelation 1–3</span>
          </span>
        </div>
        <p class="hidden sm:block font-serif-atlas italic text-[11px] text-[#6a5b49] truncate -mt-0.5">
          <span class="only-zh">启示录 1–3 章 · 哥白尼高程地形 · 自然地球 1:10m 水系与海岸线</span>
          <span class="only-en">Revelation 1–3 · Copernicus DEM (GLO-30) relief · Natural Earth 1:10m</span>
        </p>
      </div>
    </div>
    <div class="flex items-center justify-between sm:justify-end gap-1.5 w-full sm:w-auto shrink-0">
      <div class="flex items-center gap-0.5 sm:gap-1 bg-[#ede3cc] p-0.5 sm:p-1 rounded-lg border border-[#c8b89c]">
        <button id="btn-preset-stop" onclick="applyPreset('stop')" class="preset-btn px-2 py-1 rounded-md text-[11px] sm:text-xs font-medium bg-[#2b2520] text-[#faf6ec]"><span class="only-zh">本城</span><span class="only-en">City</span></button>
        <button id="btn-preset-circuit" onclick="applyPreset('circuit')" class="preset-btn px-2 py-1 rounded-md text-[11px] sm:text-xs font-medium text-[#3b3228] hover:bg-[#faf6ec]"><span class="only-zh">七城路线</span><span class="only-en">Circuit</span></button>
        <button id="btn-preset-empire" onclick="applyPreset('empire')" class="preset-btn px-2 py-1 rounded-md text-[11px] sm:text-xs font-medium text-[#3b3228] hover:bg-[#faf6ec]"><span class="only-zh">罗马东部</span><span class="only-en">Roman East</span></button>
      </div>
      <div class="flex items-center gap-1 sm:gap-1.5">
        <button id="btn-relief" onclick="toggleRelief()" class="px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-lg border border-[#8b7b65] bg-[#faf6ec] hover:bg-[#efe5cf] text-[11px] sm:text-xs font-semibold text-[#2b2520]"></button>
        <button id="btn-lang-toggle" onclick="toggleLanguage()" class="flex items-center rounded-lg border border-[#8b7b65] bg-[#ede3cc] p-0.5 text-[11px] sm:text-xs font-semibold shadow-sm hover:border-[#5c4a35]">
          <span id="lang-pill-zh" class="px-1.5 sm:px-2 py-0.5 sm:py-1 rounded-md text-[#3b3228]">中文</span>
          <span id="lang-pill-en" class="px-1.5 sm:px-2 py-0.5 sm:py-1 rounded-md bg-[#2b2520] text-[#faf6ec]">EN</span>
        </button>
        <button id="btn-sidebar" onclick="toggleSidebar()" class="px-2 py-1 sm:px-2.5 sm:py-1.5 rounded-lg border border-[#8b7b65] bg-[#faf6ec] hover:bg-[#efe5cf] text-[11px] sm:text-xs font-medium text-[#2b2520] flex items-center gap-1">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="15" y1="4" x2="15" y2="20"></line></svg>
          <span id="sidebar-toggle-text" class="hidden md:inline"></span>
        </button>
      </div>
    </div>
  </header>

  <div id="workspace" class="flex flex-1 min-h-0 overflow-hidden">
    <section id="map-pane" class="relative flex-1 min-w-0 h-full">
      <div id="map-container" class="zl-a zl-b zl-c zl-d"></div>
      <div class="map-neatline-overlay"></div>

      <div class="absolute top-3 left-3 z-20 atlas-legend-glass rounded-lg w-[214px] sm:w-[262px] max-w-[calc(100%-24px)]">
        <div class="px-2.5 py-1.5 sm:px-3 sm:py-2 flex items-start justify-between gap-1.5 cursor-pointer select-none" onclick="toggleLegend()">
          <div class="min-w-0 legend-text-halo">
            <div class="text-[9.5px] sm:text-[10px] font-semibold text-[#5b4a36] leading-tight" id="cart-eyebrow"></div>
            <div class="font-serif-atlas font-bold text-[12.5px] sm:text-[14.5px] text-[#1f1914] leading-tight mt-0.5" id="cart-title"></div>
            <div class="text-[10.5px] sm:text-[11px] text-[#3f3428] leading-snug mt-0.5" id="cart-sub"></div>
          </div>
          <button id="btn-legend" type="button" class="mt-0.5 p-0.5 rounded hover:bg-[#efe6d2]/50 text-[#4a3d2f] shrink-0">
            <svg id="legend-arrow" class="w-3.5 h-3.5 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
        <div id="legend-content" class="px-2.5 pb-2 pt-1 border-t border-[#8b7b65]/30 legend-text-halo">
          <div id="legend-items" class="space-y-0.5"></div>
          <div class="pt-1.5 mt-1 border-t border-[#8b7b65]/25 grid grid-cols-2 gap-x-2 gap-y-0.5 text-[10.5px] text-[#2b2520]">
            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="w-3 h-3 accent-[#6B2D5C]" checked onchange="setLayer('province',this.checked)"><span class="only-zh">亚细亚省</span><span class="only-en">Province</span></label>
            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="w-3 h-3 accent-[#8A6A1A]" checked onchange="setLayer('roads',this.checked)"><span class="only-zh">道路</span><span class="only-en">Roads</span></label>
            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="w-3 h-3 accent-[#2F6F73]" checked onchange="setLayer('sites',this.checked)"><span class="only-zh">遗址</span><span class="only-en">Sites</span></label>
            <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" class="w-3 h-3 accent-[#2b2520]" checked onchange="setLayer('places',this.checked)"><span class="only-zh">其他地名</span><span class="only-en">Other places</span></label>
          </div>
        </div>
      </div>

      <div id="data-status-pill" class="hidden sm:flex absolute top-3 right-3 z-20 atlas-legend-glass rounded-md px-2 py-1 text-[10px] text-[#3d3328] flex-col gap-0.5 max-w-[230px] legend-text-halo">
        <div class="flex items-center gap-1.5"><span id="dot-dem" class="w-2 h-2 rounded-full bg-emerald-600 shrink-0"></span><span id="text-dem" class="font-semibold"></span></div>
        <div class="flex items-center gap-1.5"><span id="dot-ne" class="w-2 h-2 rounded-full bg-amber-500 animate-pulse shrink-0"></span><span id="text-ne"></span></div>
      </div>

      <div class="absolute bottom-[62px] right-4 z-20 flex flex-col items-end gap-2">
        <div class="hidden sm:block bg-[#faf6ec]/92 rounded-full p-1 border border-[#8b7b65] shadow" aria-hidden="true">
          <svg class="w-10 h-10" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="44" fill="none" stroke="#8b7b65" stroke-width="1.3" />

  { t:{zh:'七封信的共同结构',en:'The Shared Pattern of the Letters'},
    b:{zh:'<p>七封信都依同一格式写成：</p><ul><li>写信给某教会的使者；</li><li>基督的自称，大多取自第1章的异象；</li><li>“我知道你的行为”；</li><li>称赞与责备（士每拿、非拉铁非没有责备，老底嘉没有称赞）；</li><li>劝勉与警告；</li><li>“圣灵向众教会所说的话，凡有耳的，就应当听”；</li><li>给得胜者的应许，多在启示录末两章应验。</li></ul><p>前三封信先说“凡有耳的”，后说应许；后四封信次序颠倒 [[Rev 2:7]]；[[Rev 2:29]]。</p><p>七封信在主题与文学上构成交错结构（A–B–C–D–C′–B′–A′）：以弗所与老底嘉、士每拿与非拉铁非、别迦摩与撒狄两两相对，推雅推喇居中（见“结构”分页）。形式上，学者也指出这些信仿照帝王颁布的谕令，故称“王的谕令”。</p>',
       en:'<p>All seven letters follow one pattern:</p><ul><li>address to the angel of the church;</li><li>Christ’s self-title, mostly drawn from the vision of chapter 1;</li><li>I know your works;</li><li>commendation and rebuke (Smyrna and Philadelphia receive no rebuke, Laodicea no commendation);</li><li>exhortation and warning;</li><li>he who has an ear, let him hear what the Spirit says to the churches;</li><li>a promise to the overcomer, mostly fulfilled in the last two chapters.</li></ul><p>In the first three letters the call to hear precedes the promise; in the last four it follows [[Rev 2:7]]; [[Rev 2:29]].</p><p>Thematically and literarily the letters form a chiasm (A–B–C–D–C′–B′–A′): Ephesus and Laodicea, Smyrna and Philadelphia, Pergamum and Sardis answer each other, with Thyatira at the centre (see the Structure tab). In form, scholars have also noted that the letters imitate imperial edicts, hence royal edicts.</p>'} },
  { t:{zh:'书信的次序与传递路线',en:'The Order of the Letters and the Circuit'},
    b:{zh:'<p>七城的次序 [[Rev 1:11]] 正好构成一条环形路线：从拔摩渡海到最近的大港以弗所，北上士每拿、别迦摩，再折向东南，经赫尔穆斯河谷到推雅推喇、撒狄、非拉铁非，最后到老底嘉，再顺迈安德河谷回到以弗所。拉姆齐（1904）认为这是送信人沿罗马大道巡回的路线；七城也都是各自地区的交通中心。下表是地图上示意道路的长度：</p>',
       en:'<p>The order of the cities [[Rev 1:11]] traces a loop: across the sea from Patmos to Ephesus, the nearest great port; north to Smyrna and Pergamum; then south-east through the Hermus valley to Thyatira, Sardis and Philadelphia; on to Laodicea; and back down the Maeander valley to Ephesus. Ramsay (1904) read it as a courier’s circuit along the Roman roads, each city being a hub for its district. The table gives the length of the schematic roads on the map:</p>'},
    distances:true },
  { t:{zh:'启示录的成书年代',en:'The Date of Revelation'},
    b:{zh:'<ul><li><b>晚期说（约公元95年）</b>：爱任纽说异象见于多米田在位末年（《驳异端》5.30.3），亚历山大的革利免与优西比乌也说约翰从拔摩回到以弗所。教会状况似乎也指向较晚的年代，如以弗所已“离弃起初的爱心”，老底嘉在公元60年地震后已重建富足。本图采用此说。</li><li><b>早期说（约公元68–69年）</b>：有人依据 [[Rev 11:1-2]] 似乎假定圣殿仍在，以及 [[Rev 17:10]] 的“五位已经倾倒”推算，主张写于尼禄死后、耶路撒冷陷落以前。</li></ul>',
       en:'<ul><li><b>Late date (c. AD 95)</b>: Irenaeus places the vision near the end of Domitian’s reign (Against Heresies 5.30.3), and Clement of Alexandria and Eusebius have John return from Patmos to Ephesus. The churches’ condition seems to fit a later date: Ephesus has left its first love, and Laodicea has rebuilt in wealth after the earthquake of AD 60. This atlas follows the late date.</li><li><b>Early date (c. AD 68–69)</b>: some argue from [[Rev 11:1-2]], which seems to assume the temple still stands, and from the five kings who have fallen in [[Rev 17:10]], for a date after Nero and before the fall of Jerusalem.</li></ul>'} },
  { t:{zh:'几种读法',en:'Ways of Reading the Letters'},
    b:{zh:'<ul><li><b>交错结构（本图以此为纲）</b>：七道谕令两两相对，中心是推雅推喇；整组信是基督对自己家中的审判，先于对巴比伦、兽与撒但的审判 [[1Pe 4:17]]。</li><li><b>历史处境</b>：先听这七封信对第一世纪亚细亚七个真实教会说了什么；城市背景用来印证经文，而非取代经文。</li><li><b>普世适用</b>：七个教会代表各时代教会都可能出现的光景；每封信都以“圣灵向众教会所说的话”结束，表示信是写给所有教会的 [[Rev 2:7]]。</li><li><b>教会历史分期</b>：有人把七个教会读成教会史上相继的七个时期。德席尔瓦不赞同此说，理由是它忽略了今天多数教会的处境，更像士每拿与别迦摩。</li></ul>',
       en:'<ul><li><b>Chiastic structure (the framework of this atlas)</b>: the seven edicts answer each other in pairs around Thyatira at the centre; together they are Christ’s judgment of His own household, before His judgment of Babylon, the Beast and Satan [[1Pe 4:17]].</li><li><b>Historical setting</b>: first hear what the letters said to seven real churches in 1st-century Asia; the city backgrounds illustrate the text rather than replace it.</li><li><b>Universal application</b>: the seven churches stand for conditions found in churches of every age; each letter ends with what the Spirit says to the churches, addressing all of them [[Rev 2:7]].</li><li><b>Ages of church history</b>: some read the seven churches as seven successive periods. David deSilva rejects this, since it overlooks the majority of today’s churches, whose situation is more like Smyrna’s or Pergamum’s.</li></ul>'} },
  { t:{zh:'巴兰、耶洗别与尼哥拉一党',en:'Balaam, Jezebel and the Nicolaitans'},

  { t:{zh:'地图依据',en:'Basis of the Map'},

  { t:{zh:'资料来源与体例',en:'Sources and Conventions'},

  <script>
(function () {

    layers: { province: true, roads: true, sites: true, places: true },
    relief: false, autoTimer: null, detailOpen: false, sidebar: true,
    legendOpen: window.innerWidth >= 768, neStatus: 'loading'
  };

  let map = null, demLayer = null, provRenderer = null;
  const groups = {};
  const churchMarkers = new Map(), siteMarkers = new Map();
  const neLayers = {};
  const isZh = () => state.lang === 'zh';
  const T = (o) => (o == null ? '' : (typeof o === 'string' ? o : (o[state.lang] ?? '')));
  const stopIdx = (id) => STOPS.findIndex(s => s.id === id);
  const stopById = (id) => STOPS.find(s => s.id === id);
  const curStop = () => STOPS[state.stop];
  const findSite = (key) => { const [sid, id] = key.split(':'); const s = stopById(sid); return s ? { stop: s, site: (s.sites || []).find(x => x.id === id) } : null; };
  const ll = (pts) => pts.map(p => [p[1], p[0]]);          // [lon,lat] → [lat,lon]

  function haversine(a, b) {
    const R = 6371, toR = Math.PI / 180;
    const dLat = (b[0] - a[0]) * toR, dLon = (b[1] - a[1]) * toR;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * toR) * Math.cos(b[0] * toR) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  const pathKm = (pts) => pts.reduce((acc, p, i) => i ? acc + haversine(pts[i - 1], p) : 0, 0);

  /* =========================================================================
     2. SCRIPTURE REFERENCES
        中文：和合本 — page tooltip (getBible "cus"), click opens 微读圣经
        English：LSB — plain reference text tagged by Logos Reftagger
     ========================================================================= */
  // key: [微读书卷代码, 中文简称, English abbreviation, single-chapter flag]
  const BOOKS = {
    Gen:['gen','创','Gen'], Exo:['exo','出','Exod'], Num:['num','民','Num'], Deu:['deu','申','Deut'],
    '1Ki':['1ki','王上','1 Kgs'], '2Ki':['2ki','王下','2 Kgs'], Psa:['psa','诗','Ps'], Pro:['pro','箴','Prov'],
    Isa:['isa','赛','Isa'], Eze:['ezk','结','Ezek'], Dan:['dan','但','Dan'], Zec:['zec','亚','Zech'],
    Mat:['mat','太','Matt'], Mar:['mrk','可','Mark'], Luk:['luk','路','Luke'], Joh:['jhn','约','John'],
    Act:['act','徒','Acts'], Rom:['rom','罗','Rom'], '1Co':['1co','林前','1 Cor'], Eph:['eph','弗','Eph'],
    Php:['php','腓','Phil'], Col:['col','西','Col'], '1Th':['1th','帖前','1 Thess'], '1Ti':['1ti','提前','1 Tim'],
    '2Ti':['2ti','提后','2 Tim'], Phm:['phm','门','Phlm',1], Heb:['heb','来','Heb'], '1Pe':['1pe','彼前','1 Pet'],
    '1Jo':['1jn','约壹','1 John'], Jud:['jud','犹','Jude',1], Rev:['rev','启','Rev']
  };
  const GB_NR = { Gen:1, Exo:2, Num:4, Deu:5, '1Ki':11, '2Ki':12, Psa:19, Pro:20, Isa:23, Eze:26, Dan:27, Zec:38,
    Mat:40, Mar:41, Luk:42, Joh:43, Act:44, Rom:45, '1Co':46, Eph:49, Php:50, Col:51, '1Th':52, '1Ti':54, '2Ti':55,
    Phm:57, Heb:58, '1Pe':60, '1Jo':62, Jud:65, Rev:66 };

  function parseRefs(str) {
    const out = [];
    const pieces = str.split(/([;,])/);
    let book = null, chap = null, lastVerse = false, sep = null;
    for (const raw of pieces) {
      if (raw === ';' || raw === ',') { sep = raw; continue; }
      let piece = raw.trim();
      if (!piece) continue;
      let showBook = false;
      const m = piece.match(/^([1-3]?[A-Z][a-z]{1,3})\s+(.+)$/);
      if (m && BOOKS[m[1]]) { book = m[1]; piece = m[2]; showBook = true; lastVerse = false; }
      if (!book) continue;
      const single = BOOKS[book][3] === 1;
      const [a, b] = piece.split(/[-–]/).map(s => s && s.trim());
      let sc, sv = null, ec = null, ev = null, cont = false;
      if (a.includes(':')) { [sc, sv] = a.split(':'); chap = sc; }
      else if (single) { sc = '1'; sv = a; chap = '1'; cont = !showBook; }
      else if (lastVerse && sep === ',') { sc = chap; sv = a; cont = true; }
      else { sc = a; chap = a; }
      if (b) {
        if (b.includes(':')) { [ec, ev] = b.split(':'); }
        else if (sv != null) { ev = b; }
        else { ec = b; }
      }
      lastVerse = sv != null;
      out.push({ book, sc, sv, ec, ev, cont, showBook, sep: out.length ? sep : null });
      sep = null;
    }
    return out;
  }

  function refLabel(r, withChap) {
    const single = BOOKS[r.book][3] === 1;
    let s;
    if (r.sv != null) {
      s = (withChap && !single ? `${r.sc}:` : '') + r.sv;
      if (r.ev != null) s += (r.ec && r.ec !== r.sc) ? `–${r.ec}:${r.ev}` : `–${r.ev}`;
    } else s = r.sc + (r.ec ? `–${r.ec}` : '');
    return s;
  }

  /* Plain-text reference for labels (no link) */
  function refPlain(str) {

  async function cuvPassage(d, limit = 14) {

  const COLOR_STOPS = [
    [-450, 204, 214, 190], [-150, 220, 226, 202], [0, 240, 231, 208], [200, 242, 232, 207],
    [500, 229, 211, 174], [900, 213, 187, 143], [1400, 195, 162, 119], [2200, 179, 144, 106], [3200, 227, 217, 204]
  ];
  function hypso(h) {
    if (h <= COLOR_STOPS[0][0]) return COLOR_STOPS[0].slice(1);
    const last = COLOR_STOPS[COLOR_STOPS.length - 1];
    if (h >= last[0]) return last.slice(1);
    for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
      const a = COLOR_STOPS[i], b = COLOR_STOPS[i + 1];
      if (h >= a[0] && h <= b[0]) {
        const t = (h - a[0]) / (b[0] - a[0]);
        return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
      }
    }
    return [240, 231, 208];
  }

  function createDEMLayer() {
    const Layer = L.GridLayer.extend({
      createTile: function (coords, done) {
        const size = 256, tile = document.createElement('canvas');
        tile.width = size; tile.height = size;
        const ctx = tile.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#f0e7d0'; ctx.fillRect(0, 0, size, size);
        const urls = [
          `https://tiles.mapterhorn.com/${coords.z}/${coords.x}/${coords.y}.webp`,
          `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${coords.z}/${coords.x}/${coords.y}.png`
        ];
        const render = (img) => {
          try {
            const off = document.createElement('canvas'); off.width = size; off.height = size;
            const octx = off.getContext('2d', { willReadFrequently: true });
            octx.drawImage(img, 0, 0, size, size);
            const src = octx.getImageData(0, 0, size, size).data;
            const elev = new Float32Array(size * size);
            for (let i = 0, p = 0; i < elev.length; i++, p += 4) elev[i] = (src[p] * 256 + src[p + 1] + src[p + 2] / 256) - 32768;
            const n = Math.PI - (2 * Math.PI * (coords.y + 0.5)) / Math.pow(2, coords.z);
            const latRad = Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
            const mpp = (156543.03392 * Math.cos(latRad)) / Math.pow(2, coords.z);
            const zF = (state.relief ? 4.4 : 2.3) / Math.max(mpp, 1);
            const alt = 45 * Math.PI / 180, az = 315 * Math.PI / 180, sA = Math.sin(alt), cA = Math.cos(alt);
            const k0 = state.relief ? 0.58 : 0.36;
            const outImg = ctx.createImageData(size, size), out = outImg.data;
            for (let y = 0; y < size; y++) {
              const ym = y > 0 ? y - 1 : 0, yp = y < size - 1 ? y + 1 : size - 1;
              for (let x = 0; x < size; x++) {
                const xm = x > 0 ? x - 1 : 0, xp = x < size - 1 ? x + 1 : size - 1, idx = y * size + x;
                const dzdx = ((elev[y * size + xp] - elev[y * size + xm]) * 0.5) * zF;
                const dzdy = ((elev[yp * size + x] - elev[ym * size + x]) * 0.5) * zF;
                const slope = Math.atan(Math.sqrt(dzdx * dzdx + dzdy * dzdy)), aspect = Math.atan2(dzdy, -dzdx);
                let sh = sA * Math.cos(slope) + cA * Math.sin(slope) * Math.cos(az - aspect);

              }
            }

  function filterNE(geo) {
    const minLon = 5, maxLon = 42, minLat = 27, maxLat = 47;
    const hit = (coords) => {
      const st = [coords];
      while (st.length) {
        const c = st.pop();
        if (typeof c[0] === 'number') { if (c[0] >= minLon && c[0] <= maxLon && c[1] >= minLat && c[1] <= maxLat) return true; }
        else for (let i = 0; i < c.length; i++) st.push(c[i]);

      return false;
    };

  function interpolate(pts, steps = 8) {
    if (pts.length < 3) return pts;
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {

      const ang = -Math.atan2(b[0] - a[0], (b[1] - a[1]) * Math.cos(pts[i][0] * Math.PI / 180)) * 180 / Math.PI;
      arr.push(L.marker(pts[i], { pane: 'arrowsPane', interactive: false, icon: L.divIcon({ className: '', iconSize: [16, 16], iconAnchor: [8, 8],
        html: `<svg width="16" height="16" viewBox="-10 -10 20 20" style="transform:rotate(${ang.toFixed(1)}deg);display:block;overflow:visible"><polygon points="7,0 -5,-5.5 -2.5,0 -5,5.5" fill="${color}" stroke="#faf6ec" stroke-width="1.6" stroke-linejoin="round"/></svg>` }) }));
    });
    return arr;
  }
  const activeSegment = () => (state.stop >= 1 ? CIRCUIT[state.stop - 1] : null);

  function renderRoads() {
    if (!map) return;
    groups.roads.clearLayers();
    if (!state.layers.roads) return;
    const act = activeSegment();
    Object.entries(ROADS).forEach(([key, r]) => {
      const pts = interpolate(r.pts, 6);
      const inCircuit = CIRCUIT.includes(key), on = key === act;
      if (r.sea) {
        L.polyline(pts, { pane: 'roadsPane', interactive: false, color: on ? '#8A6A1A' : '#2f6178', weight: on ? 3.4 : 2.2, opacity: 0.9, dashArray: '2 7', lineCap: 'round' }).addTo(groups.roads);
      } else if (inCircuit) {
        L.polyline(pts, { pane: 'roadsPane', interactive: false, color: '#faf6ec', weight: on ? 8 : 5, opacity: 0.8, lineCap: 'round', lineJoin: 'round' }).addTo(groups.roads);
        L.polyline(pts, { pane: 'roadsPane', interactive: false, color: on ? '#8A6A1A' : '#a8894a', weight: on ? 4.2 : 2.4, opacity: on ? 1 : 0.85, lineCap: 'round', lineJoin: 'round' }).addTo(groups.roads);
      } else {
        L.polyline(pts, { pane: 'roadsPane', interactive: false, color: '#7a6955', weight: 1.5, opacity: 0.7, dashArray: '5 5', lineCap: 'round' }).addTo(groups.roads);
      }
      if (on) {
        routeArrows(pts, '#8A6A1A').forEach(m => m.addTo(groups.roads));
        const km = Math.round(pathKm(r.pts) / 5) * 5;
        const mid = pts[Math.floor(pts.length / 2)];
        L.marker(mid, { pane: 'arrowsPane', interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0],
          html: `<div class="dist-tag">${isZh() ? (r.sea ? `海路约 ${km} 公里` : `约 ${km} 公里`) : (r.sea ? `c. ${km} km by sea` : `c. ${km} km`)}</div>` }) }).addTo(groups.roads);
      }
    });
  }

  /* ---------- Churches ---------- */
  function addChurches() {
    STOPS.forEach((s, i) => {
      const m = L.marker([s.lat, s.lon], { pane: 'churchPane', keyboard: false, icon: L.divIcon({ className: '', iconSize: [24, 24], iconAnchor: [12, 12],
        html: `<div class="ch-pin ${s.n ? '' : 'prologue'}" data-stop="${s.id}"><div class="ch-pulse"></div><div class="ch-dot">${s.chi || '✦'}</div>
          <div class="ch-name">${bil(s.zh, s.en)}<small>${bil(refPlainFixed(s.ref, 'zh'), refPlainFixed(s.ref, 'en'))}</small></div></div>` }) });
      m.on('click', () => { stopAuto(); select({ type: 'stop', id: s.id }, true); });
      m.addTo(groups.churches);
      churchMarkers.set(s.id, m);
    });
  }
  function refPlainFixed(ref, lang) { const keep = state.lang; state.lang = lang; const out = refPlain(ref); state.lang = keep; return out; }

  function syncChurchHighlight() {
    churchMarkers.forEach((m, id) => {
      const el = m.getElement && m.getElement(); const pin = el && el.querySelector('.ch-pin');
      if (!pin) return;
      const on = curStop().id === id;
      pin.classList.toggle('is-active', on); m.setZIndexOffset(on ? 800 : 0);
    });
  }

  /* ---------- Archaeological sites ---------- */
  function addSites() {
    groups.sites.clearLayers(); siteMarkers.clear();
    STOPS.forEach(s => (s.sites || []).forEach(x => {
      const key = `${s.id}:${x.id}`;
      const m = L.marker([x.lat, x.lon], { pane: 'sitePane', keyboard: false, icon: L.divIcon({ className: '', iconSize: [12, 12], iconAnchor: [6, 6],
        html: `<div class="site-pin" data-site="${key}"><div class="site-dia"></div><div class="site-lbl">${bil(x.zh, x.en)}</div></div>` }) });
      m.on('click', () => { stopAuto(); select({ type: 'site', id: key }, true); });
      m.addTo(groups.sites);
      siteMarkers.set(key, m);
    }));
  }
  function syncSiteHighlight() {
    siteMarkers.forEach((m, key) => {
      const el = m.getElement && m.getElement(); const pin = el && el.querySelector('.site-pin');
      if (pin) pin.classList.toggle('is-active', state.sel.type === 'site' && state.sel.id === key);
    });
  }

  /* =========================================================================
     4. SELECTION
     ========================================================================= */
  function fly(target, zoom) {
    if (!map) return;
    const mobile = window.innerWidth < 640;
    if (Array.isArray(target[0])) map.flyToBounds(target, { duration: 0.9, padding: mobile ? [10, 10] : [30, 30] });
    else map.flyTo(target, Math.max(5, zoom - (mobile ? 0.75 : 0)), { duration: 0.9 });
  }
  const CIRCUIT_VIEW = [[37.15, 26.35], [39.35, 29.45]];
  const EMPIRE_VIEW = [[30.8, 11.5], [43.2, 37.0]];

  function setStop(i) {
    state.stop = i;
    renderRoads(); syncChurchHighlight(); renderLegend(); renderStopBar();
    const s = curStop();
    document.getElementById('step-counter').textContent = s.n ? (isZh() ? `第 ${s.n} 封 / 7` : `Letter ${s.n} / 7`) : (isZh() ? '序幕' : 'Prologue');
  }

  function select(sel, doFly) {
    state.sel = sel;
    groups.sel && groups.sel.clearLayers();
    if (sel.type === 'stop') {
      setStop(stopIdx(sel.id));
      const s = curStop();
      if (doFly) fly([s.lat, s.lon], s.zoom - 1);
    } else if (sel.type === 'site') {
      const f = findSite(sel.id);
      setStop(stopIdx(f.stop.id));
      if (map) L.marker([f.site.lat, f.site.lon], { pane: 'selPane', interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0],
        html: `<div class="site-callout"><div class="box">${T(f.site)}</div></div>` }) }).addTo(groups.sel);
      if (doFly) fly([f.site.lat, f.site.lon], Math.min(13.5, f.stop.zoom + 1));
    } else if (sel.type === 'event') {
      const ev = EVENTS.find(e => e.id === sel.id);
      if (ev.stop) { setStop(stopIdx(ev.stop)); if (doFly) { const s = curStop(); fly([s.lat, s.lon], 9); } }
      else { renderLegend(); if (doFly) fly(EMPIRE_VIEW); }
    }
    syncSiteHighlight();
    renderDetail(); renderList(true);
  }

  /* =========================================================================
     5. RENDERING
     ========================================================================= */
  const partBadge = (s) => s.n ? `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#e9dec6] text-[#6a4b10]">${isZh() ? `第 ${s.n} 封信` : `Letter ${s.n}`}</span>`
    : `<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#e9dec6] text-[#6a4b10]">${isZh() ? '序幕' : 'Prologue'}</span>`;

  function renderCartouche() {
    const s = curStop();
    document.getElementById('cart-eyebrow').textContent = (s.n ? (isZh() ? `第 ${s.n} 封信` : `Letter ${s.n}`) : (isZh() ? '序幕' : 'Prologue')) + '　' + refPlain(s.ref);
    document.getElementById('cart-title').innerHTML = `${T(s)} <span class="font-greek font-normal text-[12px] text-[#5c4a35]">${s.gr}</span>`;
    document.getElementById('cart-sub').textContent = T(s.modern);
  }

  function renderLegend() {
    renderCartouche();
    const row = (sw, txt) => `<div class="flex items-center gap-1.5 text-[11px]">${sw}<span>${txt}</span></div>`;
    const line = (style) => `<span class="inline-block w-5 shrink-0" style="${style}"></span>`;
    const zh = isZh();
    const items = [
      row(`<span class="inline-flex w-4 h-4 rounded-full shrink-0 items-center justify-center text-[8px] font-bold" style="background:#c9a034;border:1.5px solid #faf6ec;box-shadow:0 0 0 1px #5c4512"></span>`, zh ? '七教会（字母为交错结构位置，A 对 A′、B 对 B′、C 对 C′，D 居中）' : 'The seven churches, lettered by chiastic position (A pairs with A′, B with B′, C with C′; D at the centre)'),
      row(line('border-top:3px solid #8A6A1A'), zh ? '书信传递路线（罗马大道，示意）' : 'Circuit of the letters (Roman roads, schematic)'),
      row(line('border-top:2.5px dotted #2f6178'), zh ? '拔摩至以弗所的海路' : 'Sea route, Patmos to Ephesus'),
      row(line('border-top:1.5px dashed #7a6955'), zh ? '其他罗马道路（示意）' : 'Other Roman roads (schematic)'),
      row(`<span class="inline-block w-4 h-3 rounded-[2px] shrink-0" style="background:#6B2D5C12;border:1.5px dashed #6B2D5C"></span>`, zh ? '罗马亚细亚省（示意）' : 'Roman province of Asia (schematic)'),
      row(`<span class="inline-block w-4 h-3 rounded-[2px] shrink-0" style="background:#bed7e5;border:1.2px dashed #2f6178"></span>`, zh ? '第一世纪海岸线（示意，今已淤积成陆）' : '1st-century shoreline (schematic, now silted)'),
      row(`<span class="inline-block w-2.5 h-2.5 shrink-0 ml-[3px] mr-[3px]" style="transform:rotate(45deg);background:#2F6F73;border:1.2px solid #faf6ec;box-shadow:0 0 0 .8px #1d4548"></span>`, zh ? '考古遗址（放大后显示）' : 'Archaeological site (shown when zoomed in)')
    ];
    document.getElementById('legend-items').innerHTML = items.join('');
  }

  function renderStopBar() {
    document.getElementById('stop-bar').innerHTML = STOPS.map((s, i) => {
      const on = i === state.stop, pc = '#A8801A';
      return `<button onclick="window._stop('${s.id}')" class="flex items-center gap-1.5 px-2 py-1 rounded-md border text-left whitespace-nowrap transition-colors ${on ? 'bg-[#2b2520] text-[#faf6ec] border-[#2b2520]' : 'bg-[#faf6ec]/75 border-[#c8b89c] text-[#2b2520] hover:bg-[#faf6ec]'}" style="box-shadow: inset 0 -3px 0 ${pc}" aria-pressed="${on}">
        <span class="w-6 h-5 rounded-full text-[10px] font-bold flex items-center justify-center shrink-0 ${on ? 'bg-[#c9a227] text-[#2b2008]' : 'bg-[#e9dec6] text-[#6a4b10]'}">${s.chi || '✦'}</span>
        <span class="flex flex-col leading-tight"><span class="text-[11.5px] font-bold">${T(s)}</span><span class="text-[9.5px] ${on ? 'text-[#e9dec6]' : 'text-[#6a5b49]'}">${refPlain(s.ref)}</span></span></button>`;
    }).join('');
    const active = document.querySelector('#stop-bar [aria-pressed="true"]');
    if (active) active.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  }

  const TABS = [
    ['stops', '七城', 'Cities'], ['structure', '结构', 'Structure'], ['compare', '书信对照', 'Compare'], ['sites', '遗址', 'Sites'],
    ['timeline', '年表', 'Timeline'], ['notes', '注释', 'Notes']
  ];
  function renderTabs() {
    document.getElementById('tabs').innerHTML = TABS.map(([k, zh, en]) =>
      `<button role="tab" aria-selected="${state.tab === k}" onclick="window._tab('${k}')" class="tab-btn ${state.tab === k ? 'is-active' : ''} px-2.5 py-1 rounded-md border border-[#cbbba0] bg-[#faf6ec] text-[11.5px] font-semibold whitespace-nowrap hover:bg-[#efe5cf]">${isZh() ? zh : en}</button>`).join('');
    document.getElementById('detail-panel').style.display = state.tab === 'notes' ? 'none' : '';
  }

  const body = (zhCls = 'text-[12.5px] leading-relaxed', enCls = 'font-serif-atlas text-[14px] leading-snug') => isZh() ? zhCls : enCls;
  const stopChip = (id) => { const s = stopById(id); return `<button onclick="window._stop('${id}')" class="text-[10.5px] px-1.5 py-0.5 rounded border border-[#c8b89c] bg-[#f3ebd8] hover:bg-[#e9dec6] text-[#5c4a35]">${s.n ? '' : '✦ '}${T(s)}</button>`; };
  const secHead = (zh, en) => `<div class="text-[11px] font-bold text-[#5c4a35] mb-1 mt-0.5">${isZh() ? zh : en}</div>`;

  const chiTag = (k) => `<span class="inline-flex items-center justify-center min-w-[1.6rem] h-5 px-1 rounded-full text-[10.5px] font-bold text-white" style="background:${CHI_COLOR[k[0]]}">${k}</span>`;
  function structBlock(s) {
    const pr = PAIRS.find(p => p.k === s.chi[0]);
    const other = s.pair ? stopById(s.pair) : null;
    return `<div class="rounded-md border border-[#d9cbb2] bg-[#f7f1e3] px-2.5 py-2 mb-2.5" style="box-shadow: inset 3px 0 0 ${CHI_COLOR[s.chi[0]]}">
      <div class="flex items-center gap-1.5 mb-1">${chiTag(s.chi)}<span class="${body('text-[12.5px] font-bold', 'font-serif-atlas text-[14.5px] font-bold')} text-[#2b2520]">${T(s.theme)}</span></div>
      <div class="text-[11px] text-[#5c4a35] mb-1">${T(pr.t)}${other ? ` · <button onclick="window._stop('${other.id}')" class="underline decoration-dotted hover:text-[#9b2226]">${isZh() ? '对应：' : 'Pairs with '}${T(other)} ${other.chi}</button>` : ''}</div>
      <ul class="basis ${body('text-[11.5px] leading-relaxed', 'font-serif-atlas text-[13px] leading-snug')} text-[#2b2520]">${pr.pts.map(x => `<li>${rich(T(x))}</li>`).join('')}</ul></div>`;
  }

  function keyVerse(s) {
    const r = parseRefs(s.quote.ref)[0];
    return isZh()
      ? `<figure class="border-l-2 border-[#A8801A] pl-2.5 py-2 pr-2.5 bg-[#f5efe0] rounded-r mb-2.5">
          <blockquote class="font-kai text-[14px] leading-relaxed text-[#2b2520]" data-b="${GB_NR[r.book]}" data-sc="${r.sc}" data-sv="${r.sv ?? ''}" data-ec="${r.ec ?? ''}" data-ev="${r.ev ?? ''}">“${s.quote.zh}”</blockquote>
          <figcaption class="text-right text-[11px] text-[#6a5b49] font-serif-atlas mt-1">—— ${refHTML(s.quote.ref)}</figcaption></figure>`
      : `<figure class="border-l-2 border-[#A8801A] pl-2.5 py-1.5 pr-2.5 bg-[#f5efe0] rounded-r mb-2.5">
          <span class="font-serif-atlas text-[14px] text-[#2b2520]"><b>Key verse:</b> ${refHTML(s.quote.ref)}</span></figure>`;
  }

  function compactDetail() {
    const sel = state.sel, zh = isZh();
    let head = '';
    if (sel.type === 'stop') { const s = curStop(); head = `<span class="text-[10.5px] font-semibold text-[#6a4b10] shrink-0">${s.n ? (zh ? `第 ${s.n} 封信` : `Letter ${s.n}`) : (zh ? '序幕' : 'Prologue')}</span><span class="font-serif-atlas font-bold text-[14px] text-[#2b2520] truncate">${T(s)}</span><span class="text-[10.5px] text-[#6a5b49] shrink-0">${refPlain(s.ref)}</span>`; }
    else if (sel.type === 'site') { const f = findSite(sel.id); head = `<span class="font-serif-atlas font-bold text-[14px] text-[#1d4548] truncate">◆ ${T(f.site)}</span><span class="text-[10.5px] text-[#6a5b49] shrink-0">${T(f.stop)}</span>`; }
    else { const ev = EVENTS.find(e => e.id === sel.id); head = `<span class="text-[11px] font-bold text-[#6a4b10] shrink-0">${T(ev.yr)}</span><span class="text-[11.5px] text-[#2b2520] truncate">${stripRefs(T(ev.t))}</span>`; }
    return `<div class="flex items-center justify-between gap-2"><div class="flex items-baseline gap-1.5 min-w-0">${head}</div>
      <button onclick="window._detail(true)" class="shrink-0 text-[10.5px] px-1.5 py-0.5 rounded border border-[#c8b89c] bg-[#faf6ec] hover:bg-[#efe5cf]">${zh ? '展开详情 ▾' : 'Details ▾'}</button></div>`;
  }

  function renderDetail() {
    const el = document.getElementById('detail-panel');
    const sel = state.sel;
    const compact = state.tab !== 'stops' && !state.detailOpen;
    el.classList.toggle('p-3', !compact); el.classList.toggle('sm:p-3.5', !compact);
    el.classList.toggle('px-3', compact); el.classList.toggle('py-1.5', compact);
    el.style.maxHeight = state.tab === 'stops' ? '' : (compact ? 'none' : '42%');
    if (compact) { el.innerHTML = compactDetail(); hideTip(); return; }
    let html = state.tab !== 'stops' ? `<div class="flex justify-end -mt-1 mb-1"><button onclick="window._detail(false)" class="text-[10.5px] px-1.5 py-0.5 rounded border border-[#c8b89c] bg-[#faf6ec] hover:bg-[#efe5cf]">${isZh() ? '收起 ▴' : 'Collapse ▴'}</button></div>` : '';
    if (sel.type === 'stop') {
      const s = curStop(), i = state.stop;
      const prev = STOPS[i - 1], next = STOPS[i + 1];
      html += `
        <div class="flex items-center justify-between gap-2 mb-1">${partBadge(s)}<span class="text-[11.5px] font-medium">${refHTML(s.ref)}</span></div>
        <div class="flex items-baseline flex-wrap gap-x-2 mb-0.5">
          <h2 class="font-serif-atlas font-bold text-xl leading-snug text-[#2b2520]">${T(s)}</h2>
          <span class="font-greek text-[14px] text-[#5c4a35]">${s.gr}</span>
        </div>
        <div class="text-[11.5px] text-[#6a5b49] mb-2">${T(s.modern)}</div>
        ${s.summary ? `<p class="${body()} text-[#2b2520] mb-2.5">${rich(T(s.summary))}</p>` : ''}
        ${s.letter ? `<dl class="kv mb-2.5">${LETTER_FIELDS.map(([k, zh, en]) => {
            const f = s.letter[k];
            return `<dt>${isZh() ? zh : en}</dt><dd class="${f.none ? 'none' : ''}">${rich(T(f))}</dd>`;
          }).join('')}</dl>` : ''}
        ${keyVerse(s)}
        ${secHead(s.n ? '城市背景' : '背景', s.n ? 'The city' : 'Background')}
        <ul class="basis ${body('text-[12px] leading-relaxed', 'font-serif-atlas text-[13.5px] leading-snug')} text-[#2b2520] mb-2.5">${s.bg.map(b => `<li>${rich(T(b))}</li>`).join('')}</ul>
        ${(s.sites || []).length ? `${secHead('遗址', 'Sites')}<div class="flex flex-wrap gap-1 mb-2.5">${s.sites.map(x => `<button onclick="window._site('${s.id}:${x.id}')" class="text-[11px] px-1.5 py-0.5 rounded border border-[#a9c7c8] bg-[#eef5f3] hover:bg-[#dcebe8] text-[#1d4548]">◆ ${T(x)}</button>`).join('')}</div>` : ''}
        <div class="text-[11.5px] text-[#5c4a35] mb-2.5">${isZh() ? '相关经文：' : 'See also: '}${refHTML(s.cross)}</div>
        <div class="flex items-center justify-end gap-1">
          ${prev ? `<button onclick="window._stop('${prev.id}')" class="text-[10.5px] px-1.5 py-0.5 rounded border border-[#c8b89c] bg-[#faf6ec] hover:bg-[#efe5cf]">◀ ${T(prev)}</button>` : ''}
          ${next ? `<button onclick="window._stop('${next.id}')" class="text-[10.5px] px-1.5 py-0.5 rounded border border-[#c8b89c] bg-[#faf6ec] hover:bg-[#efe5cf]">${T(next)} ▶</button>` : ''}
        </div>`;
    } else if (sel.type === 'site') {
      const f = findSite(sel.id);
      html += `
        <div class="flex items-center justify-between gap-2 mb-1">
          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#dcebe8] text-[#1d4548]">${isZh() ? '考古遗址' : 'Archaeological site'}</span>${stopChip(f.stop.id)}</div>
        <h2 class="font-serif-atlas font-bold text-lg text-[#2b2520] leading-snug mb-1.5">◆ ${T(f.site)}</h2>
        <p class="${body()} text-[#2b2520] mb-2.5">${rich(T(f.site.d))}</p>
        <div class="flex flex-wrap gap-1">${f.stop.sites.filter(x => x.id !== f.site.id).map(x => `<button onclick="window._site('${f.stop.id}:${x.id}')" class="text-[11px] px-1.5 py-0.5 rounded border border-[#a9c7c8] bg-[#eef5f3] hover:bg-[#dcebe8] text-[#1d4548]">◆ ${T(x)}</button>`).join('')}</div>`;
    } else if (sel.type === 'event') {
      const ev = EVENTS.find(e => e.id === sel.id);
      html += `
        <div class="flex items-center justify-between gap-2 mb-1">
          <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#e9dec6] text-[#5c4a35]">${isZh() ? '年表' : 'Timeline'}</span>
          <span class="text-[12px] font-bold text-[#6a4b10]">${T(ev.yr)}</span></div>
        <p class="${body('text-[13px] leading-relaxed', 'font-serif-atlas text-[15px] leading-snug')} text-[#2b2520] mb-2.5">${rich(T(ev.t))}</p>
        ${ev.stop ? stopChip(ev.stop) : ''}`;
    }
    el.innerHTML = html;
    el.scrollTop = 0;
    hideTip();
    if (sel.type === 'stop' && isZh()) fillCuvQuote(el);
    retag(el);
  }

  /* ---------- Lists ---------- */
  const rowCls = (on) => `no-rt w-full text-left px-2.5 py-1.5 rounded-lg border transition-colors flex items-start gap-2 ${on ? 'bg-[#fcf9f2] border-[#8b7b65] shadow-sm' : 'bg-[#faf6ec]/75 border-transparent hover:bg-[#efe6d2]'}`;
  const groupHead = (txt, color) => `<div class="pt-2 pb-0.5 px-1 text-[11px] font-bold" style="color:${color}">${txt}</div>`;
  const numDot = (s) => `<span class="w-5 h-5 mt-0.5 rounded-full text-[10px] font-bold flex items-center justify-center shrink-0" style="background:#c9a034;color:#2b2008;min-width:1.5rem">${s.chi || '✦'}</span>`;

  function distanceTable() {
    const names = ['patmos', 'ephesus', 'smyrna', 'pergamum', 'thyatira', 'sardis', 'philadelphia', 'laodicea', 'ephesus'];
    let total = 0;
    const rows = CIRCUIT.map((k, i) => {
      const km = pathKm(ROADS[k].pts); total += km;
      const a = stopById(names[i]), b = stopById(names[i + 1]);
      return `<tr class="border-b border-[#e0d4bc]"><td class="px-1.5 py-1">${T(a)} → ${T(b)}${ROADS[k].sea ? (isZh() ? '（海路）' : ' (by sea)') : ''}</td><td class="px-1.5 py-1 text-right whitespace-nowrap">${Math.round(km / 5) * 5}</td></tr>`;
    }).join('');
    return `<div class="overflow-x-auto mt-1.5"><table class="w-full text-[11.5px] border-collapse"><thead><tr class="bg-[#4A4A4A] text-white">
      <th class="text-left px-1.5 py-1 font-semibold">${isZh() ? '路段' : 'Leg'}</th><th class="text-right px-1.5 py-1 font-semibold">${isZh() ? '约（公里）' : 'c. km'}</th></tr></thead>
      <tbody>${rows}<tr class="font-bold"><td class="px-1.5 py-1">${isZh() ? '全程' : 'Total'}</td><td class="px-1.5 py-1 text-right">${Math.round(total / 10) * 10}</td></tr></tbody></table></div>`;
  }

  function renderList(keepScroll) {
    const c = document.getElementById('list-container');
    const sel = state.sel;
    let html = '';
    if (state.tab === 'structure') {
      const card = (inner, extra = '') => `<article class="mb-2 p-3 rounded-lg bg-[#fcf9f2] border border-[#e0d4bc] ${extra}">${inner}</article>`;
      const h3 = (zh, en) => `<h3 class="font-serif-atlas font-bold text-[15px] text-[#2b2520] mb-1.5">${isZh() ? zh : en}</h3>`;
      const tx = (cls) => body(cls || 'text-[12.5px] leading-relaxed', 'font-serif-atlas text-[14px] leading-snug');
      html += card(`<h2 class="font-serif-atlas font-bold text-[17px] text-[#2b2520] mb-1.5">${T(STRUCT.title)}</h2>
        ${h3('信息', 'The message')}
        <p class="${tx()} text-[#2b2520] mb-1.5">${T(STRUCT.message)}</p>
        <div class="text-[11.5px] text-[#5c4a35]">${isZh() ? '参：' : 'Cf. '}${refHTML(STRUCT.refs)}</div>`, 'border-l-4 !border-l-[#B03A2E]');
      const outline = (kind) => STOPS.filter(s => s.chi).map(s => {
        const on = curStop().id === s.id && sel.type === 'stop';
        const lab = kind === 'struct' ? `${isZh() ? `王的谕令 ${s.n}` : `Royal Edict ${s.n}`}<span class="text-[#6a5b49] font-normal"> ${refPlain(s.ref)}</span>` : T(s.theme);
        return `<button onclick="window._stop('${s.id}')" class="no-rt w-full text-left flex items-start gap-1.5 py-0.5 rounded hover:bg-[#efe6d2] ${on ? 'bg-[#efe6d2]' : ''}" style="padding-left:${CHI_LEVEL[s.chi] * 18}px">
          ${chiTag(s.chi)}<span class="${tx('text-[12px] leading-snug')} ${kind === 'struct' ? 'font-semibold' : ''} text-[#2b2520]">${lab}${kind === 'struct' ? ` <span class="text-[#6a5b49] font-normal">· ${T(s)}</span>` : ''}</span></button>`;
      }).join('');
      html += card(h3('结构大纲', 'Structural outline') + outline('struct'));
      html += card(h3('主题大纲', 'Thematic outline') + outline('theme'));
      html += PAIRS.map(p => card(`<div class="flex items-center gap-1.5 mb-1">${chiTag(p.k)}${p.b ? chiTag(p.k + '′') : ''}<span class="font-serif-atlas font-bold text-[14px] text-[#2b2520]">${T(p.t)}</span></div>
        <div class="flex flex-wrap gap-1 mb-1.5">${[p.a, p.b].filter(Boolean).map(stopChip).join('')}</div>
        <ul class="basis ${tx('text-[12px] leading-relaxed')} text-[#2b2520]">${p.pts.map(x => `<li>${rich(T(x))}</li>`).join('')}</ul>`, '')).join('');
      html += `<p class="px-1 pb-2 text-[11px] text-[#6a5b49]">${T(STRUCT.source)}</p>`;
    } else if (state.tab === 'stops') {
      html = STOPS.map((s, i) => {
        const on = sel.type === 'stop' && state.stop === i;
        const sub = s.letter ? T(s.letter.title).replace(/[；;]\s*(参|cf\.).*$/, '').replace(/\s*\[\[.*?\]\]/g, '') : T(s.title);
        return `<button id="row-stop-${s.id}" onclick="window._stop('${s.id}')" class="${rowCls(on)} mb-1" style="box-shadow: inset 3px 0 0 #A8801A">
          ${numDot(s)}
          <span class="min-w-0 flex-1"><span class="flex items-baseline justify-between gap-1"><span class="text-[13px] font-bold text-[#2b2520]">${T(s)}</span><span class="text-[10.5px] text-[#6a5b49] shrink-0">${refPlain(s.ref)}</span></span>
          <span class="block ${body('text-[11px]', 'font-serif-atlas text-[12.5px]')} text-[#6a5b49] leading-snug">${sub}</span></span></button>`;
      }).join('');
    } else if (state.tab === 'compare') {
      html = `<div class="flex flex-wrap gap-1 px-1 pb-1.5">${[['theme', '主题', 'Theme'], ...LETTER_FIELDS].map(([k, zh, en]) =>
        `<button onclick="window._field('${k}')" class="px-2 py-0.5 rounded-full border text-[11px] font-semibold ${state.field === k ? 'bg-[#2b2520] text-[#faf6ec] border-[#2b2520]' : 'bg-[#faf6ec] border-[#cbbba0] hover:bg-[#efe5cf]'}">${isZh() ? zh : en}</button>`).join('')}</div>`;
      html += STOPS.filter(s => s.letter).map(s => {
        const f = state.field === 'theme' ? s.theme : s.letter[state.field], on = sel.type === 'stop' && curStop().id === s.id;
                return `<div class="mb-1 px-2.5 py-1.5 rounded-lg border ${on ? 'bg-[#fcf9f2] border-[#8b7b65]' : 'bg-[#faf6ec]/75 border-transparent'}" style="box-shadow: inset 3px 0 0 #A8801A">
          <button onclick="window._stop('${s.id}')" class="no-rt flex items-center gap-1.5 mb-0.5 hover:underline">${numDot(s)}<span class="text-[12.5px] font-bold">${T(s)}</span><span class="text-[10.5px] text-[#6a5b49]">${refPlain(s.ref)}</span></button>
          <div class="${body('text-[12px] leading-relaxed', 'font-serif-atlas text-[13.5px] leading-snug')} ${f.none ? 'italic text-[#8b7b65]' : 'text-[#2b2520]'}">${rich(T(f))}</div></div>`;
      }).join('');
    } else if (state.tab === 'sites') {
      STOPS.forEach(s => {
        if (!(s.sites || []).length) return;
        html += groupHead(`${s.n ? '' : '✦ '}${T(s)}`, '#1d4548');
        s.sites.forEach(x => {
          const key = `${s.id}:${x.id}`, on = sel.type === 'site' && sel.id === key;
          html += `<button id="row-site-${s.id}-${x.id}" onclick="window._site('${key}')" class="${rowCls(on)} mb-0.5">
            <i class="inline-block w-2.5 h-2.5 mt-1 shrink-0" style="transform:rotate(45deg);background:${on ? '#c9a227' : '#2F6F73'}"></i>
            <span class="min-w-0 flex-1"><span class="block text-[12.5px] font-bold text-[#2b2520]">${T(x)}</span>
            <span class="block ${body('text-[11px]', 'font-serif-atlas text-[12.5px]')} text-[#6a5b49] leading-snug">${stripRefs(T(x.d))}</span></span></button>`;
        });
      });
    } else if (state.tab === 'timeline') {
      html = `<div class="relative pl-3"><div class="absolute left-[18px] top-1 bottom-1 w-px bg-[#c8b89c]"></div>` + EVENTS.map(ev => {
        const on = sel.type === 'event' && sel.id === ev.id, s = ev.stop ? stopById(ev.stop) : null;
        return `<button id="row-event-${ev.id}" onclick="window._event('${ev.id}')" class="${rowCls(on)} mb-1 relative">
          <i class="inline-block w-2.5 h-2.5 mt-1 rounded-full shrink-0 border-2 border-[#faf6ec]" style="background:${ev.k >= 95 && ev.k <= 96 ? '#c9a227' : (s ? '#8A6A1A' : '#7a6955')};box-shadow:0 0 0 1px #8b7b65"></i>
          <span class="min-w-0 flex-1"><span class="flex items-baseline justify-between gap-1"><span class="text-[11.5px] font-bold text-[#6a4b10]">${T(ev.yr)}</span>${s ? `<span class="text-[10.5px] text-[#6a5b49] shrink-0">${s.n ? '' : '✦ '}${T(s)}</span>` : ''}</span>
          <span class="block ${body('text-[11.5px]', 'font-serif-atlas text-[13px]')} text-[#2b2520] leading-snug">${stripRefs(T(ev.t))}</span></span></button>`;
      }).join('') + `</div>`;
    } else if (state.tab === 'notes') {
      html = NOTES.map((n, i) => `
        <article class="mb-2 p-3 rounded-lg bg-[#fcf9f2] border border-[#e0d4bc]">
          <h3 class="font-serif-atlas font-bold text-[15px] text-[#2b2520] mb-1.5 flex items-center gap-2"><span class="w-5 h-5 rounded-full bg-[#8A6A1A] text-white text-[10px] font-bold inline-flex items-center justify-center shrink-0">${i + 1}</span>${T(n.t)}</h3>
          <div class="note-body text-[#2b2520]">${rich(T(n.b))}</div>
          ${n.distances ? distanceTable() : ''}
        </article>`).join('');
    }
    const prevScroll = c.scrollTop;
    c.innerHTML = html;
    retag(c);
    if (keepScroll) c.scrollTop = prevScroll;
    const activeId = sel.type === 'stop' ? `row-stop-${curStop().id}` : sel.type === 'site' ? `row-site-${sel.id.replace(':', '-')}` : `row-event-${sel.id}`;
    const row = document.getElementById(activeId);
    if (row) {
      const cr = c.getBoundingClientRect(), rr = row.getBoundingClientRect();
      if (rr.top < cr.top || rr.bottom > cr.bottom) c.scrollTo({ top: Math.max(0, rr.top - cr.top + c.scrollTop - cr.height / 3), behavior: 'smooth' });
    }
  }

  /* =========================================================================
     6. GLOBAL UI
     ========================================================================= */
  function updateButtons() {
    const zh = isZh();
    document.getElementById('btn-autoplay').textContent = state.autoTimer ? (zh ? '⏸ 暂停' : '⏸ Pause') : (zh ? '▶ 依次巡回' : '▶ Tour');
    const rb = document.getElementById('btn-relief');
    rb.textContent = state.relief ? (zh ? '标准地形' : 'Standard') : (zh ? '立体增强' : 'Relief +');
    rb.classList.toggle('bg-[#2b2520]', state.relief); rb.classList.toggle('text-[#faf6ec]', state.relief);
    rb.classList.toggle('bg-[#faf6ec]', !state.relief); rb.classList.toggle('text-[#2b2520]', !state.relief);
    document.getElementById('sidebar-toggle-text').textContent = state.sidebar ? (zh ? '隐藏研经栏' : 'Hide study') : (zh ? '显示研经栏' : 'Show study');
    const tips = {
      'btn-zoom-in': zh ? '放大' : 'Zoom in', 'btn-zoom-out': zh ? '缩小' : 'Zoom out', 'btn-zoom-reset': zh ? '回到本城' : 'Back to this city',
      'btn-lang-toggle': zh ? '切换语言' : 'Switch language', 'btn-sidebar': zh ? '显示或隐藏研经栏' : 'Show or hide the study panel',
      'btn-legend': zh ? '展开或收起图例' : 'Show or hide the legend'
    };
    Object.entries(tips).forEach(([id, t]) => { const b = document.getElementById(id); if (b) { b.title = t; b.setAttribute('aria-label', t); } });
  }

  function applyLanguage() {
    const zh = isZh();
    document.documentElement.lang = zh ? 'zh-CN' : 'en';
    document.body.classList.toggle('lang-zh', zh); document.body.classList.toggle('lang-en', !zh);
    document.title = zh ? '启示录七教会地图' : 'The Seven Churches of Revelation · An Atlas';
    const on = ['bg-[#2b2520]', 'text-[#faf6ec]'], off = ['text-[#3b3228]'];
    const pz = document.getElementById('lang-pill-zh'), pe = document.getElementById('lang-pill-en');
    (zh ? pz : pe).classList.add(...on); (zh ? pz : pe).classList.remove(...off);
    (zh ? pe : pz).classList.remove(...on); (zh ? pe : pz).classList.add(...off);
    hideTip(); setStop(state.stop);
    if (state.sel.type === 'site' && groups.sel) { groups.sel.clearLayers(); const f = findSite(state.sel.id);
      L.marker([f.site.lat, f.site.lon], { pane: 'selPane', interactive: false, icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="site-callout"><div class="box">${T(f.site)}</div></div>` }) }).addTo(groups.sel); }
    updateButtons(); updateStatusUI(); renderTabs(); renderDetail(); renderList(true); syncLegend();
  }

  function stopAuto() { if (state.autoTimer) { clearInterval(state.autoTimer); state.autoTimer = null; updateButtons(); } }
  function syncLegend() {
    document.getElementById('legend-content').style.display = state.legendOpen ? '' : 'none';
    document.getElementById('legend-arrow').style.transform = state.legendOpen ? '' : 'rotate(-90deg)';
  }
  function setPresetUI(name) {
    document.querySelectorAll('.preset-btn').forEach(b => { b.classList.remove('bg-[#2b2520]', 'text-[#faf6ec]'); b.classList.add('text-[#3b3228]'); });
    const b = document.getElementById(`btn-preset-${name}`); if (b) { b.classList.add('bg-[#2b2520]', 'text-[#faf6ec]'); b.classList.remove('text-[#3b3228]'); }
  }

  window._stop = (id) => { stopAuto(); setPresetUI('stop'); select({ type: 'stop', id }, true); };
  window._site = (key) => { stopAuto(); setPresetUI('stop'); select({ type: 'site', id: key }, true); };
  window._event = (id) => { stopAuto(); select({ type: 'event', id }, true); };
  window._tab = (t) => { state.tab = t; state.detailOpen = false; renderTabs(); renderDetail(); renderList(false); };
  window._detail = (v) => { state.detailOpen = v; renderDetail(); };
  window._field = (f) => { state.field = f; renderList(true); };
  window.toggleLanguage = () => { state.lang = isZh() ? 'en' : 'zh'; applyLanguage(); };
  window.toggleRelief = () => { state.relief = !state.relief; updateButtons(); if (demLayer) demLayer.redraw(); };
  window.mapZoom = (d) => { stopAuto(); if (map) map.setZoom(map.getZoom() + d); };
  window.applyPreset = (name) => {
    stopAuto(); setPresetUI(name); if (!map) return;
    if (name === 'stop') { const s = curStop(); fly([s.lat, s.lon], s.zoom - 1); }
    else if (name === 'circuit') fly(CIRCUIT_VIEW);
    else fly(EMPIRE_VIEW);
  };
  window.setLayer = (k, v) => {
    state.layers[k] = v;
    if (k === 'province') renderProvince();
    if (k === 'roads') renderRoads();
    if (k === 'sites' && map) { if (v) groups.sites.addTo(map); else map.removeLayer(groups.sites); }
    if (k === 'places') document.getElementById('map-container').classList.toggle('hide-places', !v);
  };
  window.toggleLegend = () => { state.legendOpen = !state.legendOpen; syncLegend(); };
  window.toggleSidebar = () => {
    state.sidebar = !state.sidebar;
    const sb = document.getElementById('study-sidebar'), mp = document.getElementById('map-pane');
    sb.classList.toggle('hidden', !state.sidebar); sb.classList.toggle('hidden-sidebar', !state.sidebar);
    mp.classList.toggle('expanded-map', !state.sidebar);
    updateButtons(); setTimeout(() => map && map.invalidateSize(), 120);
  };
  window.stepStop = (d) => {
    stopAuto();
    let n = state.stop + d; if (n < 0) n = STOPS.length - 1; if (n >= STOPS.length) n = 0;
    setPresetUI('stop'); select({ type: 'stop', id: STOPS[n].id }, true);
  };
  window.toggleAutoPlay = () => {
    if (state.autoTimer) { stopAuto(); return; }
    setPresetUI('stop');
    select({ type: 'stop', id: curStop().id }, true);
    state.autoTimer = setInterval(() => select({ type: 'stop', id: STOPS[(state.stop + 1) % STOPS.length].id }, true), 7000);
    updateButtons();
  };
  document.addEventListener('keydown', (e) => {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') window.stepStop(1);
    if (e.key === 'ArrowLeft') window.stepStop(-1);
  });

  /* =========================================================================
     7. START
     ========================================================================= */
  initMap();
  if (map) map.fitBounds(CIRCUIT_VIEW, { padding: [20, 20] });
  applyLanguage();
  select({ type: 'stop', id: 'patmos' }, false);
  setTimeout(() => map && map.invalidateSize(), 250);
})();

  </script>
</body>
</html>
